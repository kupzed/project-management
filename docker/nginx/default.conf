# =============================================
# Nginx Reverse Proxy Configuration
# =============================================
#
# Penjelasan:
# Nginx bertindak sebagai "pintu masuk" tunggal untuk semua traffic.
# Nginx memutuskan kemana request dikirim berdasarkan URL path:
#
#   /api/*     → PHP-FPM (Laravel backend) via FastCGI
#   /storage/* → File statis (uploads) dari shared volume
#   /*         → Node.js (SvelteKit frontend) via HTTP proxy
#
# Ini disebut "reverse proxy" karena Nginx menerima request dari
# client lalu meneruskan ke server internal yang tidak terbuka ke publik.

server {
    listen 80;
    server_name _;

    # Maksimal ukuran upload (sesuaikan dengan PHP config)
    client_max_body_size 25M;

    # -----------------------------------------------
    # 1. Laravel API — Forward ke PHP-FPM
    # -----------------------------------------------
    # Semua request /api/* dikirim ke PHP-FPM container
    # FastCGI adalah protokol komunikasi antara Nginx dan PHP-FPM
    # (berbeda dari HTTP biasa — lebih efisien untuk PHP)
    location /api/ {
        # "php" adalah nama service di docker-compose.yml
        # Docker secara otomatis resolve nama ini ke IP container
        fastcgi_pass php:9000;

        # Beritahu PHP-FPM file mana yang harus dieksekusi
        # Semua request Laravel masuk melalui public/index.php
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;

        # Include parameter FastCGI standar (REQUEST_URI, QUERY_STRING, dll.)
        include fastcgi_params;

        # Override beberapa parameter agar Laravel bisa membaca URL dengan benar
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;

        # Timeout untuk request yang lama (misal: AI processing)
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
    }

    # -----------------------------------------------
    # 2. Sanctum CSRF Cookie (jika diperlukan)
    # -----------------------------------------------
    location /sanctum/ {
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # -----------------------------------------------
    # 3. Storage Files — Serve file upload (statis)
    # -----------------------------------------------
    # File yang di-upload user (foto, dokumen, dll.)
    # Di-serve langsung oleh Nginx (lebih cepat dari PHP)
    location /storage/ {
        # "alias" memetakan /storage/ ke path fisik di volume
        alias /var/www/backend/storage/app/public/;

        # Cache file statis di browser selama 30 hari
        expires 30d;
        add_header Cache-Control "public, immutable";

        # Jika file tidak ditemukan, return 404
        try_files $uri =404;
    }

    # -----------------------------------------------
    # 4. SvelteKit Frontend — Proxy ke Node.js
    # -----------------------------------------------
    # Semua request yang tidak match di atas dikirim ke frontend
    location / {
        # "frontend" adalah nama service di docker-compose.yml
        proxy_pass http://frontend:3000;

        # Forward header asli dari client (IP, host, protocol)
        # Agar SvelteKit tahu request aslinya dari mana
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (untuk HMR di development — opsional)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -----------------------------------------------
    # 5. Logging
    # -----------------------------------------------
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # -----------------------------------------------
    # 6. Security Headers
    # -----------------------------------------------
    # Mencegah browser menampilkan halaman di iframe (clickjacking)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Mencegah browser "sniffing" tipe konten
    add_header X-Content-Type-Options "nosniff" always;

    # Aktifkan XSS filter bawaan browser
    add_header X-XSS-Protection "1; mode=block" always;
}
